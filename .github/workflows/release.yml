name: 打包发布 Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: '本次 Release 说明(可选,不填则读 changelog 最新条)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: |
          VER=$(grep -oP 'CURRENT_VERSION = "\K[^"]+' worker.js | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "读取到版本号: $VER"

      - name: 打包 zip
        run: |
          VER="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp worker.js dist/
          cp changelog.json dist/
          cp README.md dist/
          cd dist
          zip -r "EmbyProxy-CF-FAKE-${VER}.zip" worker.js changelog.json README.md
          cd ..
          echo "打包完成: dist/EmbyProxy-CF-FAKE-${VER}.zip"

      - name: 生成 Release 说明
        id: notes
        run: |
          NOTES="${{ github.event.inputs.notes }}"
          if [ -z "$NOTES" ]; then
            NOTES=$(node -e "const c=require('./changelog.json');const v=c.versions[0];console.log(v.version+' - '+v.title);(v.items||[]).forEach(i=>console.log('- '+i))")
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          gh release create "v${VER}" \
            "dist/EmbyProxy-CF-FAKE-${VER}.zip" \
            --title "EmbyProxy-CF-FAKE v${VER}" \
            --notes "${{ steps.notes.outputs.notes }}"
