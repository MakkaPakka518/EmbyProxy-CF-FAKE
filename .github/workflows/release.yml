name: 自动发版（伪装版）

on:
  workflow_dispatch:
    inputs:
      notes:
        description: '发布说明(留空自动读取 changelog.json 最新版本)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号与生成发布说明
        id: meta
        env:
          NOTES: ${{ github.event.inputs.notes || '' }}
        run: |
          set -e
          VER=$(python3 -c "import json;print(json.load(open('changelog.json'))['versions'][0]['version'])")
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
          python3 - <<'EOF'
          import json, os
          d = json.load(open('changelog.json'))
          v = d['versions'][0]
          notes = os.environ.get('NOTES', '').strip()
          if notes:
              body = notes
          else:
              body = '## ' + v['version'] + (' ' + v['title'] if v.get('title') else '') + '\n\n'
              body += '\n'.join('- ' + it for it in v.get('items', []))
          body += '\n\n> 部署方法：复制 worker.js 全部内容粘贴到 Cloudflare Worker，保存并部署即可。'
          with open('body.md', 'w') as f:
              f.write(body)
          EOF

      - name: 打包发行版 zip
        run: |
          VER="${{ steps.meta.outputs.VER }}"
          mkdir -p dist
          cp worker.js dist/worker.js
          cp changelog.json dist/changelog.json
          cp README.md dist/README.md
          (cd dist && zip -r "../EmbyProxy-CF-FAKE-v${VER}.zip" .)

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.meta.outputs.VER }}"
          gh release create "v${VER}" \
            --title "v${VER}" \
            --notes-file body.md \
            "EmbyProxy-CF-FAKE-v${VER}.zip" worker.js changelog.json
